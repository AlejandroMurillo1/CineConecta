spring.application.name=cineconecta
spring.main.allow-bean-definition-overriding=true

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/cineconecta?currentSchema=cineconecta}
spring.datasource.username=${POSTGRES_USER:cine_app}
spring.datasource.password=${POSTGRES_PASSWORD:cine_app_dev}
# RNF-07: si PostgreSQL no responde, fallar en 5 s con la página 503 (por defecto Hikari espera 30 s).
spring.datasource.hikari.connection-timeout=${POSTGRES_CONNECT_TIMEOUT_MS:5000}

# Informes: misma base, usuario de solo lectura cine_report (ver shared.config.ReportingDataSourceConfig).
cineconecta.reporting.datasource.url=${spring.datasource.url}
cineconecta.reporting.datasource.username=${REPORT_POSTGRES_USER:cine_report}
cineconecta.reporting.datasource.password=${REPORT_POSTGRES_PASSWORD:cine_report_dev}
# Informes en MongoDB: mismo servidor, usuario de solo lectura cineReport.
cineconecta.reporting.mongodb.uri=${spring.mongodb.uri}
cineconecta.reporting.mongodb.username=${REPORT_MONGODB_USER:cineReport}
cineconecta.reporting.mongodb.password=${REPORT_MONGODB_PASSWORD:cine_report_dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mongodb.uri=${MONGODB_URI:mongodb://cineApp:cine_app_dev@localhost:27017/cineconecta?authSource=cineconecta}
spring.mongodb.database=${MONGODB_DB:cineconecta}
# RNF-07: espera máxima para encontrar el servidor de MongoDB (ver shared.config.DatabaseTimeoutsConfig).
cineconecta.mongodb.timeout-ms=${MONGODB_TIMEOUT_MS:5000}
spring.data.mongodb.auto-index-creation=false

# JWT de clientes y administradores (modulo shared). El secreto por defecto es SOLO para desarrollo:
# en cualquier otro entorno definan JWT_SECRET (>= 32 bytes) y JWT_COOKIE_SECURE=true si hay HTTPS.
app.jwt.secret=${JWT_SECRET:dev-only-cineconecta-jwt-secret-change-me-0123456789}
app.jwt.ttl=${JWT_TTL:60m}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

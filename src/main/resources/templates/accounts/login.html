<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Iniciar sesión', ~{})}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('login')}"></nav>

<main id="main" class="cc-container cc-container-narrow">
    <header class="cc-header cc-fade-in">
        <h1>Iniciar sesión</h1>
        <p class="cc-muted">Entra con el correo de tu cuenta.</p>
    </header>

    <div th:replace="~{shared/layout :: flash}"></div>

    <section class="cc-card">
        <form class="cc-form" th:action="@{/login}" method="post" novalidate>
            <input type="hidden" name="next" th:value="${next}" th:if="${!#strings.isEmpty(next)}">
            <div class="cc-field">
                <label for="email">Correo electrónico</label>
                <input class="cc-input" id="email" name="email" type="email" autocomplete="email"
                       th:value="${email}" required autofocus>
            </div>
            <div class="cc-field">
                <label for="password">Contraseña</label>
                <input class="cc-input" id="password" name="password" type="password"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="cc-btn cc-btn-primary">Entrar</button>
        </form>
        <p class="cc-hint">¿No tienes cuenta? <a th:href="@{/register}">Regístrate</a></p>
    </section>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>

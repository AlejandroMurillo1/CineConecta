<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{catalog/fragments/layout :: head(${episodeId == null ? 'Agregar episodio' : 'Editar episodio'})}" /><body><header th:replace="~{catalog/fragments/layout :: nav('admin')}" /><main class="container admin-page form-page">
<a class="back-link" th:href="@{/admin/contents/{id}(id=${series.id})}">← Volver a la serie</a><p class="eyebrow" th:text="${'TEMPORADA ' + seasonNumber}"></p><h1 th:text="${episodeId == null ? 'Nuevo episodio' : 'Editar episodio'}"></h1><p class="form-hint" th:text="${series.metadata.title}"></p><div th:replace="~{catalog/fragments/layout :: notice(${error}, null)}"></div>
<form class="edit-form" th:action="${action}" th:object="${episode}" method="post"><input type="hidden" name="version" th:value="${version}"/><div th:if="${#fields.hasGlobalErrors()}" class="notice notice-error"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><section class="form-section"><div class="form-grid"><label class="field">Número<input type="number" th:field="*{number}" min="1" required/></label><label class="field">Título<input th:field="*{title}" required/></label><label class="field">Duración (segundos)<input type="number" th:field="*{durationSeconds}" min="1" required/></label><label class="field span-2">Sinopsis<textarea th:field="*{synopsis}" rows="4" required></textarea></label></div></section><div class="action-row"><button class="button button-primary">Guardar episodio</button><a class="button button-quiet" th:href="@{/admin/contents/{id}(id=${series.id})}">Cancelar</a></div></form>
</main><footer th:replace="~{catalog/fragments/layout :: footer}" /></body></html>

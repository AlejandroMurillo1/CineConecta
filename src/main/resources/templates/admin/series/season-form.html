<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{catalog/fragments/layout :: head('Agregar temporada')}" /><body><header th:replace="~{catalog/fragments/layout :: nav('admin')}" /><main class="container admin-page form-page">
<a class="back-link" th:href="@{/admin/contents/{id}(id=${series.id})}">← Volver a la serie</a><p class="eyebrow">GESTIÓN DE SERIE</p><h1>Nueva temporada</h1><p class="form-hint" th:text="${series.metadata.title}"></p><div th:replace="~{catalog/fragments/layout :: notice(${error}, null)}"></div>
<form class="edit-form" th:action="${action}" th:object="${season}" method="post"><input type="hidden" name="version" th:value="${version}"/><div th:if="${#fields.hasGlobalErrors()}" class="notice notice-error"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><section class="form-section"><h2>Temporada</h2><div class="form-grid"><label class="field">Número<input type="number" th:field="*{number}" min="1" required/></label><label class="field span-2">Descripción<input th:field="*{description}" required/></label></div></section><section class="form-section"><h2>Primer episodio</h2><div class="form-grid"><label class="field">Número<input name="episodes[0].number" type="number" min="1" required/></label><label class="field">Título<input name="episodes[0].title" required/></label><label class="field">Duración (segundos)<input name="episodes[0].durationSeconds" type="number" min="1" required/></label><label class="field span-2">Sinopsis<textarea name="episodes[0].synopsis" rows="3" required></textarea></label></div></section><div class="action-row"><button class="button button-primary">Agregar temporada</button><a class="button button-quiet" th:href="@{/admin/contents/{id}(id=${series.id})}">Cancelar</a></div></form>
</main><footer th:replace="~{catalog/fragments/layout :: footer}" /></body></html>

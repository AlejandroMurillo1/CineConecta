<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{catalog/fragments/layout :: head(${content.metadata.title})}" /><body><header th:replace="~{catalog/fragments/layout :: nav('admin')}" />
<main class="container admin-page"><a class="back-link" th:href="@{/admin/contents}">← Volver al catálogo</a><div th:replace="~{catalog/fragments/layout :: notice(${message}, ${error})}"></div>
<section class="admin-detail"><img class="detail-poster" th:src="${content.metadata.posterUrl}" th:alt="${'Afiche de ' + content.metadata.title}"/><div class="admin-detail-copy"><p class="eyebrow" th:text="${content.type + ' · ' + content.metadata.year}"></p><h1 th:text="${content.metadata.title}"></h1><span class="status-pill" th:classappend="${' status-' + #strings.toLowerCase(content.status)}" th:text="${content.status}"></span><p class="synopsis" th:text="${content.metadata.synopsis}"></p><p th:text="${'Clasificación ' + content.metadata.ageRating + '+'}"></p>
<div class="action-row"><a class="button button-quiet" th:if="${content.status != T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}" th:href="@{/admin/contents/{id}/edit(id=${content.id})}">Editar ficha</a><form th:if="${content.status == T(com.cineconecta.platform.catalog.ContentStatus).DRAFT or content.status == T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}" th:action="@{/admin/contents/{id}/publish(id=${content.id})}" method="post"><input type="hidden" name="version" th:value="${content.version}"/><button class="button button-primary">Publicar / volver a publicar</button></form><form th:if="${content.status == T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}" th:action="@{/admin/contents/{id}/restore(id=${content.id})}" method="post"><input type="hidden" name="version" th:value="${content.version}"/><button class="button button-quiet">Restaurar como borrador</button></form><form th:if="${content.status != T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}" th:action="@{/admin/contents/{id}/retire(id=${content.id})}" method="post"><input type="hidden" name="version" th:value="${content.version}"/><button class="button button-danger">Retirar del catálogo</button></form></div>
<section class="episode-section" th:if="${content.type == T(com.cineconecta.platform.catalog.ContentType).SERIES}"><h2>Temporadas</h2><a class="button button-quiet" th:href="@{/admin/series/{id}/seasons/new(id=${content.id})}">＋ Agregar temporada</a><div class="season-block" th:each="season : ${content.details.seasons}"><h3 th:text="${'Temporada ' + season.number}"></h3><p th:text="${season.description}"></p><a class="text-link" th:href="@{/admin/series/{id}/seasons/{n}/episodes/new(id=${content.id},n=${season.number})}">Agregar episodio →</a><ul><li th:each="episode : ${season.episodes}"><span th:text="${episode.number + '. ' + episode.title}"></span><a class="text-link" th:href="@{/admin/series/{id}/seasons/{n}/episodes/{eid}/edit(id=${content.id},n=${season.number},eid=${episode.episodeId})}">Editar</a></li></ul></div></section>
</div></section></main><footer th:replace="~{catalog/fragments/layout :: footer}" /></body></html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head(${content.metadata.title}, ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/backoffice.css}">
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>
<nav th:replace="~{backoffice/fragments/admin-nav :: nav('catalog')}"></nav>

<main id="main" class="cc-container">
    <a class="cat-back-link" th:href="@{/admin/contents}">← Volver al catálogo</a>

    <div th:replace="~{shared/layout :: flash}"></div>
    <div th:if="${message != null}" class="cc-alert cc-alert-success cc-fade-in" role="status" th:text="${message}"></div>

    <section class="cc-card cat-detail-hero cc-fade-in">
        <img class="cat-detail-poster" th:src="${content.metadata.posterUrl}" th:alt="${'Afiche de ' + content.metadata.title}">
        <div class="cat-detail-copy">
            <p class="cat-eyebrow" th:text="${content.type + ' · ' + content.metadata.year}"></p>
            <h1 th:text="${content.metadata.title}"></h1>
            <span class="cc-badge"
                  th:classappend="${content.status.name() == 'PUBLISHED' ? ' cc-badge-success' : (content.status.name() == 'DRAFT' ? ' cc-badge-warning' : ' cc-badge-danger')}"
                  th:text="${content.status}"></span>
            <p class="cat-synopsis" th:text="${content.metadata.synopsis}"></p>
            <p class="cc-muted" th:text="${'Clasificación ' + content.metadata.ageRating + '+'}"></p>

            <div class="cc-actions">
                <a class="cc-btn cc-btn-secondary"
                   th:if="${content.status != T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}"
                   th:href="@{/admin/contents/{id}/edit(id=${content.id})}">Editar ficha</a>

                <form th:if="${content.status == T(com.cineconecta.platform.catalog.ContentStatus).DRAFT or content.status == T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}"
                      th:action="@{/admin/contents/{id}/publish(id=${content.id})}" method="post">
                    <input type="hidden" name="version" th:value="${content.version}">
                    <button class="cc-btn cc-btn-primary" type="submit">Publicar / volver a publicar</button>
                </form>

                <form th:if="${content.status == T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}"
                      th:action="@{/admin/contents/{id}/restore(id=${content.id})}" method="post">
                    <input type="hidden" name="version" th:value="${content.version}">
                    <button class="cc-btn cc-btn-secondary" type="submit">Restaurar como borrador</button>
                </form>

                <form th:if="${content.status != T(com.cineconecta.platform.catalog.ContentStatus).RETIRED}"
                      th:action="@{/admin/contents/{id}/retire(id=${content.id})}" method="post">
                    <input type="hidden" name="version" th:value="${content.version}">
                    <button class="cc-btn cc-btn-secondary" type="submit">Retirar del catálogo</button>
                </form>
            </div>
        </div>
    </section>

    <section class="cc-card cat-section" th:if="${content.type == T(com.cineconecta.platform.catalog.ContentType).SERIES}">
        <div class="cat-admin-header" style="margin-bottom: 1rem;">
            <h2 style="margin: 0;">Temporadas</h2>
            <a class="cc-btn cc-btn-secondary" th:href="@{/admin/series/{id}/seasons/new(id=${content.id})}">＋ Agregar temporada</a>
        </div>

        <div class="cat-season-block" th:each="season : ${content.details.seasons}">
            <h3 th:text="${'Temporada ' + season.number}"></h3>
            <p class="cc-muted" th:text="${season.description}"></p>
            <p><a th:href="@{/admin/series/{id}/seasons/{n}/episodes/new(id=${content.id},n=${season.number})}">Agregar episodio →</a></p>
            <ul class="cat-episode-list">
                <li th:each="episode : ${season.episodes}">
                    <span th:text="${episode.number + '. ' + episode.title}"></span>
                    <a th:href="@{/admin/series/{id}/seasons/{n}/episodes/{eid}/edit(id=${content.id},n=${season.number},eid=${episode.episodeId})}">Editar</a>
                </li>
            </ul>
        </div>
    </section>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Continuar viendo', ~{})}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('continue-watching')}"></nav>

<main id="main" class="cc-container">
    <div th:replace="~{shared/layout :: flash}"></div>

    <header class="cc-header">
        <h1>Continuar viendo</h1>
        <p class="cc-muted">Retoma desde donde ibas. Los títulos que terminaste ya no aparecen aquí.</p>
    </header>

    <p th:if="${items.isEmpty()}" class="cc-card">
        No tienes reproducciones pendientes. Busca algo para ver en el <a th:href="@{/catalog}">catálogo</a>.
    </p>
    <div th:unless="${items.isEmpty()}" class="cw-wrap"
         th:insert="~{viewing/fragments/continue-watching :: cards(${items})}"></div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>

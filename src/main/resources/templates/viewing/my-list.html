<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Mi lista', ~{})}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('my-list')}"></nav>

<main id="main" class="cc-container">
    <header class="cc-header">
        <h1>Mi lista</h1>
        <p class="cc-muted">Agrega títulos desde su detalle en el <a th:href="@{/catalog}">catálogo</a>.
            · <a th:href="@{/viewing/continue-watching}">Continuar viendo</a></p>
    </header>

    <p th:if="${error}" th:text="${error}" class="cc-alert cc-alert-warning" role="alert"></p>

    <p th:if="${titles.isEmpty()}" class="cc-card">Todavía no has guardado títulos.</p>
    <ul th:unless="${titles.isEmpty()}" class="cc-card">
        <li th:each="title : ${titles}">
            <a th:href="@{/catalog/{id}(id=${title.id()})}"><strong th:text="${title.title()}">Título</strong></a>
            <span th:if="${!title.status().isEmpty()}" class="cc-muted" th:text="${title.status()}">Retirado</span>
            <form th:action="@{/viewing/my-list/remove}" method="post" style="display:inline">
                <input type="hidden" name="contentId" th:value="${title.id()}">
                <button type="submit" class="cc-btn cc-btn-link">Quitar</button>
            </form>
        </li>
    </ul>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi lista | CineConecta</title>
    <link rel="stylesheet" th:href="@{/css/billing.css}">
</head>
<body>
<nav class="cc-navbar">
    <a class="cc-brand" th:href="@{/billing/plans}">CineConecta</a>
</nav>
<main class="cc-container">
    <header class="cc-header"><h1>Mi lista</h1></header>
    <p><a th:href="@{/viewing/profiles/{id}/player(id=${profileId})}">Abrir reproductor simulado</a></p>

    <p th:if="${error}" th:text="${error}" class="cc-alert cc-alert-warning" role="alert"></p>
    <form th:action="@{/viewing/profiles/{id}/my-list(id=${profileId})}" method="post" class="cc-card">
        <label for="contentId">ID del título</label>
        <input id="contentId" name="contentId" type="text" required>
        <button type="submit" class="cc-btn cc-btn-primary">Agregar a mi lista</button>
    </form>

    <p th:if="${titles.isEmpty()}">Todavía no has guardado títulos.</p>
    <ul th:unless="${titles.isEmpty()}">
        <li th:each="title : ${titles}">
            <strong th:text="${title.title()}">Título</strong>
            <span th:if="${!title.status().isEmpty()}" th:text="${title.status()}">Retirado</span>
            <form th:action="@{/viewing/profiles/{id}/my-list/remove(id=${profileId})}" method="post">
                <input type="hidden" name="contentId" th:value="${title.id()}">
                <button type="submit" class="cc-btn">Quitar de mi lista</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>

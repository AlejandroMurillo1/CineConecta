<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Reproductor', ~{::link})}">
    <link rel="stylesheet" th:href="@{/css/player.css}">
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('catalog')}"></nav>

<main id="main" class="cc-container">
    <a class="pl-back" th:if="${playable != null}"
       th:href="@{/catalog/{id}(id=${playable.contentId()})}">← Volver al detalle</a>

    <header class="cc-header">
        <h1 th:text="${playable != null} ? ${playable.title()} : 'Reproductor'">Reproductor</h1>
        <p class="cc-muted" th:if="${playable != null and playable.episodeTitle() != null}"
           th:text="|Temporada ${playable.seasonNumber()} · Episodio ${playable.episodeNumber()}: ${playable.episodeTitle()}|">
            Temporada 1 · Episodio 1</p>
    </header>

    <p th:if="${error}" th:text="${error}" class="cc-alert cc-alert-warning" role="alert"></p>

    <th:block th:unless="${playbackSession}">
        <section class="cc-card">
            <p>Elige qué ver desde el <a th:href="@{/catalog}">catálogo</a>: en el detalle de cada título
                está el botón <strong>Reproducir</strong> (en las series, uno por episodio).</p>
            <p><a th:href="@{/viewing/continue-watching}">Continuar viendo</a> ·
                <a th:href="@{/viewing/my-list}">Mi lista</a></p>
        </section>
    </th:block>

    <section th:if="${playbackSession}" class="cc-card pl-player">
        <div class="pl-screen">
            <!-- Reproductor simulado: no hay archivo de video, solo la pantalla y el avance. -->
            <video id="playback-video" class="pl-video" preload="none" playsinline muted
                   aria-label="Reproductor de video"
                   th:data-position="${position}"
                   th:data-duration="${playbackSession.durationSeconds()}"
                   th:data-playing="${playbackSession.playingSince() != null}"></video>
            <span class="pl-status"
                  th:text="${playbackSession.endedAt() != null} ? 'Finalizada' : (${playbackSession.playingSince() != null} ? 'Reproduciendo' : 'En pausa')">
                En pausa</span>
            <div class="pl-bar" role="progressbar" aria-label="Avance"
                 aria-valuemin="0" th:aria-valuemax="${playbackSession.durationSeconds()}" th:aria-valuenow="${position}">
                <div id="playback-bar" class="pl-bar-fill" th:style="|width: ${percent}%|"></div>
            </div>
        </div>

        <p class="pl-time">
            <span id="playback-position" th:text="${positionText}">00:00:00</span>
            <span class="cc-muted">/</span>
            <span th:text="${durationText}">00:00:00</span>
        </p>

        <form id="playback-checkpoint" hidden th:if="${playbackSession.playingSince() != null}"
              th:action="@{/viewing/player/{id}/checkpoint(id=${playbackSession.id()})}"
              method="post"></form>

        <form id="playback-controls" class="pl-controls" th:if="${playbackSession.endedAt() == null}"
              th:action="@{/viewing/player/{id}(id=${playbackSession.id()})}" method="post">
            <button th:if="${playbackSession.playingSince() != null}" id="playback-pause"
                    name="action" value="PAUSE" class="cc-btn cc-btn-secondary">❚❚ Pausar</button>
            <button th:if="${playbackSession.playingSince() == null}"
                    name="action" value="RESUME" class="cc-btn cc-btn-primary">▶ Reanudar</button>
            <label class="pl-seek">Ir a
                <input name="position" type="text" inputmode="numeric" placeholder="00:10:00"
                       pattern="\d{1,6}|\d{1,2}(:[0-5]\d){1,2}" title="hh:mm:ss, por ejemplo 00:12:30">
            </label>
            <button name="action" value="SEEK" class="cc-btn cc-btn-secondary">Ir</button>
            <button name="action" value="FINISH" class="cc-btn">■ Finalizar</button>
        </form>

        <p th:if="${playbackSession.endedAt() != null}">
            <a th:href="@{/catalog}">Volver al catálogo</a>
        </p>
    </section>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<script th:src="@{/js/playback.js}" defer></script>
</body>
</html>
